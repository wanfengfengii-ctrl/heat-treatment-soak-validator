services:
  api:
    build: ./api
    # 仅对 compose 内部网络暴露，不发布宿主端口
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：跑通 pytest / vitest / playwright 后退出
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_BASE_URL: http://web
